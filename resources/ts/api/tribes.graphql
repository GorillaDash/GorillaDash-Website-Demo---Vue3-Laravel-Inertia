fragment TribeInfo on Tribe {
  name
  slug
  status
  heading
  sub_heading
  public_email
  main_telephone
  organic_number
  paid_number
  telephone_url_triggers
  address_1
  address_2
  locality
  state
  state_abbreviated
  country
  postal_code
  latitude
  longitude
  timezone
  social_google_url
  social_twitter_url
  social_facebook_url
  social_linkedin_url
  social_instagram_url
  google_place_id
  meta_title
  meta_description
  whats_app_number
  page_heading
  introduction
  opening_hours
  opening_hours_array
  show_opening_hours
  contents(name: "Online Ordering URL") {
    name
    value
    type
  }
}

# One tribe by slug. `active` means trading or Opening Soon, so a pre-opening tribe
# still has a page while a Testing or closed one does not.
query getTribe($slug: String!, $locale: String) {
  tribe(slug: $slug, locale: $locale, status: "active") {
    ...TribeInfo
    teamMembers(active: true) {
      first_name
      last_name
      role
      about
      avatar
    }
  }
}

# The directory: every trading and Opening Soon tribe of one tribe type (`tribes` calls
# that status `launch`; the single `tribe` query calls it `active`), with what
# the finder cards render (address, geo, phone, hours for the "open now" badge).
query getTribes($tribeType: String, $order: [String]) {
  tribes(name: $tribeType, orderBy: $order, status: "launch") {
    name
    slug
    status
    heading
    state
    state_abbreviated
    address_1
    address_2
    locality
    postal_code
    latitude
    longitude
    main_telephone
    timezone
    opening_hours_array
  }
}

# Stores near a point, ranked by distance — powers the location search. Returns just
# the fields the result list renders. Run imperatively via the Apollo client (see
# useSearchStores): the project's useQuery is for mount-time data, not on-demand
# searches, and there's no useLazyQuery in this app.
query searchStores(
  $tribe_type: String!
  $address: String!
  $lat: Float!
  $lng: Float!
  $radius: Float!
) {
  searchStores(tribe_type: $tribe_type, address: $address, lat: $lat, lng: $lng, radius: $radius) {
    name
    slug
    address_1
    address_2
    locality
    postal_code
    latitude
    longitude
  }
}
