name: linter

on:
  push:
    branches:
      - develop
      - main
      - master
      - workos
  pull_request:
    branches:
      - develop
      - main
      - master
      - workos

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Lightweight gate (GitHub API, no checkout, ~10s). Splits the change set by
  # concern so each linter runs only when its own files changed: Pint on PHP,
  # prettier+oxlint on the frontend. A job skipped via `if:` reports as passing,
  # so the check still shows up. Push events always run (never gated).
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      php: ${{ steps.filter.outputs.php }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            php:
              - '**.php'
              - 'composer.json'
              - 'composer.lock'
              - 'pint.json'
            frontend:
              - '**.ts'
              - '**.tsx'
              - '**.vue'
              - '**.js'
              - '**.mjs'
              - '**.cjs'
              - '**.css'
              - 'resources/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.oxlintrc.json'
              - '.prettierrc.json'
              - '.prettierignore'

  # PHP formatting (Pint) — only needs PHP + composer, no Node.
  pint:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.php == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'

      - name: Install Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Run Pint
        run: composer lint

  # Frontend format + lint (prettier + oxlint) — only needs Node, no PHP/composer.
  frontend:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Format Frontend
        run: pnpm run format:check

      - name: Lint Frontend
        run: pnpm run lint:check

  # TypeScript/Vue type check (vue-tsc). Kept out of the `frontend` job because
  # it needs PHP: Wayfinder's routes/actions and types/cmsRoutes.ts are gitignored
  # and generated from artisan, so vue-tsc can't resolve `@/routes/*` without them.
  #
  # This is the ONLY type checking in CI. oxlint has no type information, and
  # `pnpm run build` (tests.yml) is esbuild transpile-only — neither can see a
  # type error. Also gated on `php` because a route/controller change alters the
  # generated Wayfinder signatures the frontend is checked against.
  types:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.php == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install Dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader
          pnpm install --frozen-lockfile

      - name: Prepare Environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # The vite plugins normally emit these on build/dev. Running the generators
      # standalone skips the (much slower) bundling we don't need here.
      - name: Generate Route Types
        run: |
          php artisan wayfinder:generate --path=resources/ts
          php artisan cms-routes:types

      - name: Type Check
        run: pnpm run types:check
