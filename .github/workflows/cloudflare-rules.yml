name: cloudflare-rules

# Converge every country's Cloudflare hosts onto deploy/cloudflare/rules.sh whenever
# the rules (or the scripts around them) change on main — so a rule change ships via
# PR + merge, without waiting for an app deploy. The script is drift-aware and skips
# zones that already match, so manual runs are always safe.
#
# Hosts are discovered from the per-country overlays (the same CLOUDFLARE_HOSTS each
# country's config.env declares), so adding a country's overlay automatically brings
# its zone under management here.
#
# One thing to know before reading a red run: apply-rules.sh PROBES the live host after
# writing and rolls the zone back if a bypass rule has stopped matching. So a failure
# here does not mean "the rules were not applied" — it means they were applied, judged
# wrong, and reverted. The zone is left as it was; fix the expression in rules.sh and
# merge again.
#
# Required repo secret:
#   CLOUDFLARE_API_TOKEN  Scoped to Cache Settings Write (plus Zone Read, which the
#                         script needs to resolve a zone from a hostname) on the zones
#                         these hosts belong to.
#
# Until the edge is wired up (no CLOUDFLARE_API_TOKEN secret, or no overlay declares
# CLOUDFLARE_HOSTS) the job skips with a notice instead of failing — a fresh clone of
# the starter shouldn't get a red X on main. Both are checked, so either half being
# missing is a skip, not a half-run.

on:
  push:
    branches: [main]
    paths:
      - 'deploy/cloudflare/**'
  workflow_dispatch: {} # allow manual converge on demand

# Never let two converges race a read-modify-write on the same zone.
concurrency:
  group: cloudflare-rules
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Resolve targets (skip when the edge isn't wired up yet)
        id: targets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN secret is not set — skipping the Cloudflare converge."
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # CLOUDFLARE_HOSTS is space-separated within one overlay and there may be
          # several overlays, so split on both and de-duplicate: two countries served
          # from one zone must not converge it twice in a row.
          HOSTS=$(grep -h '^CLOUDFLARE_HOSTS=' deploy/k8s/overlays/*/config.env \
            | cut -d= -f2- | tr ' ' '\n' | sed '/^$/d' | sort -u | tr '\n' ' ')
          if [ -z "${HOSTS// /}" ]; then
            echo "::notice::No overlay config.env declares CLOUDFLARE_HOSTS — skipping the Cloudflare converge."
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "hosts=${HOSTS}" >> "$GITHUB_OUTPUT"

      - name: Converge Cloudflare zones onto the repo rules
        if: steps.targets.outputs.skip != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          HOSTS: ${{ steps.targets.outputs.hosts }}
        run: |
          echo "Converging: ${HOSTS}"
          # Unquoted on purpose: one host per argument.
          ./deploy/cloudflare/apply-rules.sh ${HOSTS}
