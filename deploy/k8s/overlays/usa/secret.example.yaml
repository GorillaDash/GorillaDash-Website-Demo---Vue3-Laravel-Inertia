# Template. Copy to secret.yaml (gitignored), fill in, then apply:
#   cp deploy/k8s/overlays/usa/secret.example.yaml deploy/k8s/overlays/usa/secret.yaml
#   # edit values...
#   kubectl apply -f deploy/k8s/overlays/usa/secret.yaml
#
# metadata.namespace is set, so it lands in acme-usa without -n.
# Generate APP_KEY with:  php artisan key:generate --show
#                    or:  echo "base64:$(openssl rand -base64 32)"
#
# This Secret is NOT part of `apply -k` (kept out of kustomization), so a deploy
# never overwrites it. Keep the real secret.yaml backed up somewhere durable
# (e.g. Google Secret Manager) — see README "Recovering / rotating secrets".
apiVersion: v1
kind: Secret
metadata:
  name: acme-secret
  namespace: acme-usa
type: Opaque
stringData:
  APP_KEY: 'base64:REPLACE_ME'
  DB_USERNAME: 'acme'
  DB_PASSWORD: 'REPLACE_ME'
  # SSR edge identity key: sent by the ssr container as x-gd-edge-key on every
  # GraphQL call; must equal the value in the Cloud Armor allow rule (priority
  # 800 on policy graphql-api-bot-protection, project gorilla-dash-178800).
  # Same value across countries — read the canonical copy from Secret Manager:
  #   gcloud secrets versions access latest --secret=gd-ssr-edge-key --project=gorilla-dash-178800
  # Only generate a NEW value when rotating (see the GD monorepo's
  # docs/graphql-cloud-armor.md: SM version + dual Armor rule rollover).
  GD_SSR_EDGE_KEY: 'REPLACE_ME'
  # Cloudflare API token, scoped to Cache Settings Write + Zone Read on the zones
  # this client's hosts belong to — used by deploy tooling (cache-rule converge +
  # post-deploy HTML purge) and by the app for future CMS-publish purges via
  # config('services.cloudflare.key'). Same value in the GitHub repo secret
  # CLOUDFLARE_API_TOKEN (CI). Canonical copy in Secret Manager:
  #   gcloud secrets versions access latest --secret=acme-cloudflare-api-token --project=gorilla-dash-178800
  CLOUDFLARE_API_TOKEN: 'REPLACE_ME'
  # reCAPTCHA v3 secret, if the site grows a public form. Its public half,
  # RECAPTCHA_SITE_KEY, is per-domain and lives in config.env — only this side is a
  # credential. Both are issued together in the Google reCAPTCHA admin console, per
  # domain, so each country needs its own pair. Leave both blank for no captcha.
  RECAPTCHA_SECRET_KEY: ''
