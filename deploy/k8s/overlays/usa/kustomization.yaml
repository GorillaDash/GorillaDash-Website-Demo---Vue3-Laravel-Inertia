apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hungry-gorilla-usa

resources:
  - namespace.yaml
  - ../../base
  - ingress.yaml

# Fastly fronts demo.gorilladash.com (see ingress.yaml), so the origin has to refuse
# anyone who is not Fastly — the base's `cloudflare-only` policy would refuse every
# visitor instead, since none of them arrive from a Cloudflare IP.
#
# `fastly-only` is PROJECT-WIDE and already exists: TheGreatGreek created it, and this
# site attached to it as a second consumer. TheGreatGreek retired Fastly on 2026-10-06
# and moved to `cloudflare-only`, so this site is now the policy's only user and this
# repo's weekly refresh (.github/workflows/refresh-edge-ips.yml) is what keeps it
# current. Once this site moves to Cloudflare, drop this patch (the base's
# `cloudflare-only` applies) and delete the `fastly-only` policy.
patches:
  - target:
      kind: BackendConfig
      name: hungry-gorilla-backendconfig
    patch: |-
      - op: replace
        path: /spec/securityPolicy/name
        value: 'fastly-only'

# Same image for every country, built once. deploy.sh sets the tag here.
images:
  - name: app-ssr
    newName: us-west1-docker.pkg.dev/gorilla-dash-178800/hungry-gorilla/ssr
    newTag: latest
  - name: app-web
    newName: us-west1-docker.pkg.dev/gorilla-dash-178800/hungry-gorilla/web
    newTag: latest

# config.env (the ".env.usa") -> hungry-gorilla-config ConfigMap, consumed via
# envFrom in the web/scheduler/worker pods.
configMapGenerator:
  - behavior: create
    envs:
      - config.env
    name: hungry-gorilla-config

# Stable ConfigMap name so the out-of-band migrate Job can reference it.
generatorOptions:
  disableNameSuffixHash: true
