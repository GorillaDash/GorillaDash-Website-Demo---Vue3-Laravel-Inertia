apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hungry-gorilla-usa

resources:
  - namespace.yaml
  - ../../base
  - ingress.yaml

# Same image for every country, built once. deploy.sh sets the tag here.
images:
  - name: app-ssr
    newName: us-west1-docker.pkg.dev/gorilla-dash-178800/hungry-gorilla/ssr
    newTag: latest
  - name: app-web
    newName: us-west1-docker.pkg.dev/gorilla-dash-178800/hungry-gorilla/web
    newTag: latest

# config.env (the ".env.usa") -> hungry-gorilla-config ConfigMap, consumed via
# envFrom in the web/scheduler/worker pods.
configMapGenerator:
  - behavior: create
    envs:
      - config.env
    name: hungry-gorilla-config

# Stable ConfigMap name so the out-of-band migrate Job can reference it.
generatorOptions:
  disableNameSuffixHash: true
