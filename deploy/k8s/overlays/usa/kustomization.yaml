apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hungry-gorilla-usa

resources:
  - namespace.yaml
  - ../../base
  - ingress.yaml
  - managedcertificate.yaml
  - frontendconfig.yaml

# No CDN sits in front of demo.gorilladash.com, so the base's Cloudflare-only Cloud
# Armor policy would block every visitor. GKE only detaches a policy when its name is
# set to an empty string; deleting the field would leave the old one attached.
patches:
  - target:
      kind: BackendConfig
      name: hungry-gorilla-backendconfig
    patch: |-
      - op: replace
        path: /spec/securityPolicy/name
        value: ''

# Same image for every country, built once. deploy.sh sets the tag here.
images:
  - name: app-ssr
    newName: us-west1-docker.pkg.dev/gorilla-dash-178800/hungry-gorilla/ssr
    newTag: latest
  - name: app-web
    newName: us-west1-docker.pkg.dev/gorilla-dash-178800/hungry-gorilla/web
    newTag: latest

# config.env (the ".env.usa") -> hungry-gorilla-config ConfigMap, consumed via
# envFrom in the web/scheduler/worker pods.
configMapGenerator:
  - behavior: create
    envs:
      - config.env
    name: hungry-gorilla-config

# Stable ConfigMap name so the out-of-band migrate Job can reference it.
generatorOptions:
  disableNameSuffixHash: true
