# demo.gorilladash.com is served straight from Google's load balancer, with no CDN in
# front. gorilladash.com's DNS lives in Cloud DNS (zone `gorilladash`, project
# gorilla-dash-178800), where an A record points the host at the reserved static IP.
#
# TLS terminates at the load balancer with a Google-managed certificate
# (managedcertificate.yaml). Google only issues it once the host resolves to this
# Ingress's IP, so a fresh certificate sits in Provisioning for 15-60 minutes after
# the DNS record appears; that is expected, not a fault. The FrontendConfig
# redirects http to https.
#
# Because there is no Cloudflare edge, the template's Cloudflare-only Cloud Armor
# policy is detached in kustomization.yaml. Left attached, it would refuse every
# visitor, since none of them arrive from a Cloudflare IP.
#
# APP_FORCE_HTTPS=true stays set in config.env: the load balancer talks to the pods
# over plain http, and without it the app would emit http:// asset URLs.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hungry-gorilla
  annotations:
    kubernetes.io/ingress.class: 'gce'
    kubernetes.io/ingress.global-static-ip-name: 'hungry-gorilla-usa-ip'
    networking.gke.io/managed-certificates: 'hungry-gorilla-cert'
    networking.gke.io/v1beta1.FrontendConfig: 'hungry-gorilla-frontend'
spec:
  rules:
    - host: demo.gorilladash.com
      http:
        paths:
          - path: /*
            pathType: ImplementationSpecific
            backend:
              service:
                name: hungry-gorilla
                port:
                  number: 80
