# demo.gorilladash.com sits behind Fastly (service "Gorilla Dash Demo Site"), which
# terminates TLS and reaches this load balancer over plain http on :80. Cloud DNS
# (zone `gorilladash`, project gorilla-dash-178800) holds the host as a CNAME to
# j.sni.global.fastly.net, so the reserved static IP below is Fastly's backend — not
# an address any visitor resolves.
#
# This overlay therefore carries NEITHER a ManagedCertificate NOR a FrontendConfig.
# Both are deliberate absences, and both were present until 2026-09-16:
#
#   * A FrontendConfig `redirectToHttps` in front of a CDN is an infinite redirect.
#     Fastly arrives on :80, the LB answers `301 https://demo.gorilladash.com:443/`,
#     Fastly hands that back to the browser unchanged, and the browser starts over —
#     ERR_TOO_MANY_REDIRECTS, with the origin itself perfectly healthy. Fastly already
#     redirects http to https on its own (query string preserved, HSTS attached), so
#     removing it costs nothing.
#   * A Google-managed certificate cannot RENEW once the host stops resolving to this
#     Ingress, because Google validates by reaching the domain at this load balancer.
#     It keeps serving until it expires and only then fails, which is where
#     `greatgreek-cert` has been stuck. With TLS at the edge the origin needs no
#     certificate at all, so there is nothing to renew.
#
# A plain-http origin is the template's normal CDN shape (deploy/CHECKLIST.md, "TLS
# lives at Cloudflare now"). Two things follow from it:
#
#   * APP_FORCE_HTTPS=true stays set in config.env — the LB->pod leg is http, and
#     without it the app would emit http:// asset URLs.
#   * Something must stop a direct hit on the static IP from bypassing Fastly's cache,
#     WAF and TLS. kustomization.yaml attaches the `fastly-only` Cloud Armor policy.
#
# Dropping the managed-certificates annotation is NOT enough to take the certificate
# down, and the gap is silent. The ManagedCertificate controller writes a second
# annotation of its own, `ingress.gcp.kubernetes.io/pre-shared-cert`, which is absent
# from last-applied-configuration — so `kubectl apply` leaves it in place and it goes
# on pinning the certificate to the load balancer after the CR is deleted. What is
# left is a managed certificate with no owner: it serves until it expires and cannot
# renew, which is where `greatgreek-cert` has been. Remove it by hand, and only once
# the edge is off :443, because the https listener goes within seconds of it:
#
#   kubectl -n hungry-gorilla-usa annotate ingress hungry-gorilla \
#     ingress.gcp.kubernetes.io/pre-shared-cert-
#
# To put this host back on the load balancer directly (no CDN), restore the A record
# to the static IP, re-add managedcertificate.yaml + frontendconfig.yaml, and detach
# the policy — budget 15-60 minutes for the managed certificate to provision.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hungry-gorilla
  annotations:
    kubernetes.io/ingress.class: 'gce'
    kubernetes.io/ingress.global-static-ip-name: 'hungry-gorilla-usa-ip'
spec:
  rules:
    - host: demo.gorilladash.com
      http:
        paths:
          - path: /*
            pathType: ImplementationSpecific
            backend:
              service:
                name: hungry-gorilla
                port:
                  number: 80
