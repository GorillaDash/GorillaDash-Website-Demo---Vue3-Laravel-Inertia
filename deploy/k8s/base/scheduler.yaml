apiVersion: apps/v1
kind: Deployment
metadata:
  name: acme-scheduler
  labels:
    app: acme
    role: scheduler
spec:
  # Exactly ONE scheduler — never run two, or every cron task fires twice.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: acme
      role: scheduler
  template:
    metadata:
      labels:
        app: acme
        role: scheduler
    spec:
      serviceAccountName: acme
      terminationGracePeriodSeconds: 60
      initContainers:
        # Cloud SQL Auth Proxy as a native sidecar — ready before schedule:work.
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.1
          restartPolicy: Always
          args:
            - "--structured-logs"
            - "--port=3306"
            - "--health-check"
            - "--http-address=0.0.0.0"
            - "$(CLOUD_SQL_INSTANCE)"
          env:
            - name: CLOUD_SQL_INSTANCE
              valueFrom:
                configMapKeyRef:
                  name: acme-config
                  key: CLOUD_SQL_INSTANCE
          startupProbe:
            httpGet:
              path: /startup
              port: 9090
            periodSeconds: 2
            failureThreshold: 30
          securityContext:
            runAsNonRoot: true
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
      containers:
        - name: scheduler
          image: app-web # same image as web (has PHP + artisan); kustomize sets the tag
          # `schedule:work` is a long-running process that internally runs
          # `schedule:run` every minute — the container-friendly way to run the
          # Laravel scheduler (no per-minute pod churn). Define tasks in
          # routes/console.php via Schedule::command(...).
          command: ["php", "artisan", "schedule:work"]
          envFrom:
            - configMapRef:
                name: acme-config
            - secretRef:
                name: acme-secret
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
