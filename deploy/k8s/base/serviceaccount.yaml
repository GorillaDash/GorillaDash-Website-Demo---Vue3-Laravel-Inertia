apiVersion: v1
kind: ServiceAccount
metadata:
  name: juniper-table
  annotations:
    # Workload Identity: this KSA impersonates the Google SA that has
    # roles/cloudsql.client. Bind it per namespace with:
    #   gcloud iam service-accounts add-iam-policy-binding \
    #     k8s-sql@gorilla-dash-178800.iam.gserviceaccount.com \
    #     --role roles/iam.workloadIdentityUser \
    #     --member "serviceAccount:gorilla-dash-178800.svc.id.goog[<namespace>/juniper-table]"
    iam.gke.io/gcp-service-account: k8s-sql@gorilla-dash-178800.iam.gserviceaccount.com
