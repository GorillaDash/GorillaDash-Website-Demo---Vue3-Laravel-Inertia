# Cloud Build — builds web + ssr natively on GCP (amd64) and pushes to Artifact
# Registry, with cross-run caching via BuildKit inline cache.
#
# The expensive `builder` stage (composer + pnpm + vite) is built and pushed as
# its own `cache:builder` image; web and ssr then --cache-from it. First run is
# cold (~5 min); later runs reuse the builder layers (~1-3 min).
#
# Run from the repo root:
#   gcloud builds submit --region=us-west1 --project=gorilla-dash-178800 \
#     --config=deploy/cloudbuild.yaml \
#     --substitutions=_TAG=$(git rev-parse --short HEAD) .
#   (or: make build-cloud / make ship-cloud)
#
# Cloud Build auto-authenticates docker to Artifact Registry; no gcloud/buildx
# needed. The Cloud Build service account needs roles/artifactregistry.writer.

substitutions:
  _REGION: us-west1
  _REPO: hungry-gorilla
  _TAG: latest

steps:
  # 1) Build + cache the shared builder stage (the slow part).
  - id: builder
    name: gcr.io/cloud-builders/docker
    env: ['DOCKER_BUILDKIT=1']
    args:
      - build
      - --file=deploy/Dockerfile
      - --target=builder
      - --build-arg=BUILDKIT_INLINE_CACHE=1
      - --cache-from=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/cache:builder
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/cache:builder
      - .

  # 2) web — reuses the builder cache + its own previous image.
  #    Runs in PARALLEL with ssr (both only need `builder`): web installs PHP
  #    extensions while ssr runs its own `pnpm install --prod`, and neither
  #    depends on the other's output.
  - id: web
    waitFor: ['builder']
    name: gcr.io/cloud-builders/docker
    env: ['DOCKER_BUILDKIT=1']
    args:
      - build
      - --file=deploy/Dockerfile
      - --target=web
      - --build-arg=BUILDKIT_INLINE_CACHE=1
      - --cache-from=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/cache:builder
      - --cache-from=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/web:latest
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/web:${_TAG}
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/web:latest
      - .

  # 3) ssr — reuses the builder cache + its own previous image. Parallel with web.
  - id: ssr
    waitFor: ['builder']
    name: gcr.io/cloud-builders/docker
    env: ['DOCKER_BUILDKIT=1']
    args:
      - build
      - --file=deploy/Dockerfile
      - --target=ssr
      - --build-arg=BUILDKIT_INLINE_CACHE=1
      - --cache-from=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/cache:builder
      - --cache-from=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/ssr:latest
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/ssr:${_TAG}
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/ssr:latest
      - .

# Pushed after the steps succeed (includes the builder cache for next time).
images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/cache:builder
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/web:${_TAG}
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/web:latest
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/ssr:${_TAG}
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/ssr:latest

options:
  # Settled by a controlled A/B on the client build this starter was extracted from
  # (2026-08-04): same commit, same --cache-from sources, two back-to-back builds
  # differing only in machine type.
  #
  #   e2-highcpu-8    builder 47.3s  web 8.4s  ssr 17.0s  BUILD+PUSH 69.5s
  #   e2-highcpu-32   builder 37.0s  web 7.3s  ssr 13.3s  BUILD+PUSH 54.5s
  #
  # Worth ~15s (22%) for roughly 3x the per-build rate, i.e. a few cents. Do not try
  # to settle this again by eyeballing two deploy runs: build time swings 70-210s on
  # cache hit/miss alone, which dwarfs the machine type and produced two wrong
  # conclusions (7s, then 85s) before that A/B was run.
  #
  # The bigger source of variance is cache hit/miss, not this. `web` costs ~8s when
  # `--cache-from web:latest` hits and ~41s when it misses (it rebuilds
  # install-php-extensions). CAUSE STILL UNKNOWN — the obvious theory, upstream
  # retagging the moving base tags, was tested and disproved (see the note at the top
  # of deploy/Dockerfile). The misses correlate with slow PUSH on the same build, so
  # registry I/O on the worker is the current suspicion. Chase that before changing
  # anything about the base images.
  machineType: E2_HIGHCPU_32
  logging: CLOUD_LOGGING_ONLY

timeout: 1800s
